dataset:
  path: path
  label: label
  train_ratio: 0.6
  val_ratio: 0.2

layers:
  - type: dense
    count: 32
    activation: relu
  - type: dense
    count: 16
    activation: relu
  - type: dense
    count: 8
    activation: relu
  - type: dense
    count: 1
    activation: sigmoid

training:
  loss: bce
  lambda_reg: 0.01
  optimizer: 
    type: "adam"
    lr: 0.005
    mf: 0.9
    dr: 0.9

  batching:
    enabled: True
    method: "standard"
    batch_size: 64
    drop_last: True
    shuffle: True

  iterations: 10000