dataset:
  images_path: datasets/raw/mnist/train-images.idx3-ubyte
  labels_path: datasets/raw/mnist/train-labels.idx1-ubyte
  train_ratio: 0.8
  val_ratio: 0.1
  normalize: True

layers:
  - type: conv2d
    in_channels: 1
    out_channels: 8
    kernel_size: [3, 3]
    stride: 1
    pad: true
    initializer: he

  - type: relu

  - type: maxpool2d
    pool_size: 2
    stride: 2

  - type: conv2d
    in_channels: 8
    out_channels: 16
    kernel_size: [3, 3]
    stride: 1
    pad: true
    initializer: he

  - type: relu

  - type: maxpool2d
    pool_size: 2
    stride: 2

  - type: flatten

  - type: linear
    input_size: 784
    output_size: 128
  - type: relu
  - type: dropout
    rate: 0.3

  - type: linear
    output_size: 10
  - type: softmax

training:
  loss: ce

  optimizer:
    type: adam
    lr: 0.001
    reg: 0.0001

  batching:
    enabled: true
    method: standard
    batch_size: 512
    drop_last: true
    shuffle: true

  iterations: 10000
