dataset:
  path: datasets/raw/diabetes.csv
  label: Outcome
  train_ratio: 0.8
  val_ratio: 0.1

layers:
  - type: dense
    count: 32
    activation: relu
  - type: dense
    count: 16
    activation: relu
  - type: dense
    count: 8
    activation: sigmoid
  - type: dense
    count: 1
    activation: sigmoid

training:
  lr: 0.005
  lambda_reg: 0.01
  optimizer: sgd
  iterations: 10000
  batching:
    method: "standard"
    batch_size: 64
    drop_last: True
  loss: bce