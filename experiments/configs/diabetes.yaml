dataset:
  path: datasets/raw/diabetes.csv
  label: Outcome
  categorical: []
  drop: []
  train_ratio: 0.8
  val_ratio: 0.1
  normalize: True

layers:
  - type: linear
    output_size: 16
  - type: relu
  - type: dropout
    rate: 0.4

  - type: linear
    output_size: 8
  - type: relu
  - type: dropout
    rate: 0.2

  - type: linear
    output_size: 1
    initializer: xavier
  - type: sigmoid

training:
  loss: bce

  optimizer: 
    type: adam
    lr: 0.003
    reg: 0.0001

  batching:
    enabled: False
    method: standard
    batch_size: 128
    drop_last: True
    shuffle: True

  iterations: 10000