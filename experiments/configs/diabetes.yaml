dataset:
  path: datasets/raw/diabetes.csv
  label: Outcome
  train_ratio: 0.8
  val_ratio: 0.1

layers:
  - type: linear
    output_size: 32
  - type: relu
  - type: linear
    output_size: 16
  - type: relu
  - type: linear
    output_size: 8
  - type: relu
  - type: linear
    output_size: 1
    initializer: xavier
  - type: sigmoid

training:
  loss: bce

  optimizer: 
    type: sgd
    lr: 0.01
    reg: 0.01

  batching:
    enabled: True
    method: standard
    batch_size: 64
    drop_last: True
    shuffle: True

  iterations: 10000