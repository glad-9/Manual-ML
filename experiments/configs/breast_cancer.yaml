dataset:
  modality: tabular
  path: datasets/raw/breast-cancer.csv
  label: diagnosis
  categorical: []
  drop: [id]
  train_ratio: 0.8
  val_ratio: 0.1
  normalize: True

layers:
  - type: linear
    output_size: 32
  - type: relu
  - type: dropout
    rate: 0.5
  - type: linear
    output_size: 16
  - type: relu
  - type: dropout
    rate: 0.5
  - type: linear
    output_size: 8
  - type: relu
  - type: dropout
    rate: 0.5
  - type: linear
    output_size: 1
    initializer: xavier
  - type: sigmoid

training:
  loss: bce
  max_epochs: 1000

  optimizer:
    type: adam
    lr: 0.005
    reg: 0.0001

  batching:
    enabled: True
    method: standard
    batch_size: 64
    drop_last: True
    shuffle: True

