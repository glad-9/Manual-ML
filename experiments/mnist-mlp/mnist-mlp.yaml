dataset:
  path: na
  label: na
  categorical: []
  drop: []
  train_ratio: na
  val_ratio: na
  normalize: na

layers:
  - type: linear
    output_size: 784
  - type: relu
  - type: dropout
    rate: 0.0

  - type: linear
    output_size: 512
  - type: relu
  - type: dropout
    rate: 0.2

  - type: linear
    output_size: 128
  - type: relu

  - type: linear
    output_size: 10
    initializer: xavier
  - type: softmax

training:
  loss: ce
  max_epochs: 10

  optimizer:
    type: adam
    lr: 0.001
    reg: 0.001

  batching:
    enabled: True
    method: standard
    batch_size: 256
    drop_last: True
    shuffle: True

